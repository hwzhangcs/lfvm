name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 三个平台都跑全部测试。首版验收以 windows-latest（x64）为准（LFVM-O-03）。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Rust 格式与静态检查
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      # Windows 上链接 Tauri 的测试程序缺少界面组件清单而无法启动（正式程序不受影响），
      # 桌面外壳唯一的测试只用于生成 bindings.ts，与平台无关，因此只在 Linux、macOS 上运行。
      - name: Rust 测试（同时重新生成 bindings.ts）
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo test --workspace --exclude lfvm-desktop
          else
            cargo test --workspace
          fi

      - name: 稳定性快速检查（各平台跑一遍完整操作序列）
        run: cargo run -q -p lfvm-tools -- stress target/stress-check --rounds 2 --interval-secs 0

      - name: bindings.ts 与 Rust 类型一致
        if: runner.os != 'Windows'
        run: git diff --exit-code apps/desktop/src/bindings.ts

      - name: 前端检查与测试
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test

  # 打标签（v*）时出三平台安装包，作为 Release 草稿上传
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: LFVM ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
