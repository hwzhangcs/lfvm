[workspace]
resolver = "3"
members = ["crates/lfvm-platform", "crates/lfvm-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["第三组：周瀚文、戴烨铭、张瀚文、邓皓云"]

[workspace.dependencies]
lfvm-platform = { path = "crates/lfvm-platform" }
lfvm-core = { path = "crates/lfvm-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
ulid = "3"
unicode-normalization = "0.1"
dunce = "1"
sha2 = "0.10"
rayon = "1"
similar = "3"
fs4 = { version = "1", features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tempfile = "3"

# 这台开发机内存较小：降低调试信息以减少编译内存占用
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
